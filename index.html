<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Trazo">
<meta name="theme-color" content="#F6F6F8">
<meta name="description" content="Notas a mano, PDF y audio sincronizado. Gratis.">
<title>Trazo</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{
  --accent:#3F66F0; --bg:#FFFFFF; --side:#F5F5F7; --panel:#FFFFFF; --ink:#1C1C1E; --ink2:#5B6170; --ink3:#8D93A1;
  --line:rgba(20,30,60,.10); --line2:rgba(20,30,60,.16); --hover:rgba(20,30,60,.05); --sel:rgba(63,102,240,.10);
  --desk:#EDEEF2; --shadow:0 8px 30px rgba(15,20,40,.12); --shadow-s:0 2px 8px rgba(15,20,40,.08);
  --r:14px; --danger:#E5384F; --ok:#20A35A;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  color:var(--ink); -webkit-text-size-adjust:100%;
}
[data-theme=dark]{
  --bg:#18191C; --side:#111214; --panel:#222327; --ink:#F2F2F5; --ink2:#B3B7C2; --ink3:#7E8391;
  --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.16); --hover:rgba(255,255,255,.06); --sel:rgba(110,140,255,.18);
  --desk:#0E0F11; --shadow:0 10px 34px rgba(0,0,0,.5); --shadow-s:0 2px 8px rgba(0,0,0,.4);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;overscroll-behavior:none}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,select,[contenteditable]{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:disabled{opacity:.35;cursor:default}
.ic{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;display:block}
.hidden{display:none!important}
.muted{color:var(--ink2)} .small{font-size:13px} .center{text-align:center;justify-content:center} .pad{padding:4px 12px}
.grow{flex:1}

/* botones */
.ib{width:38px;height:38px;border-radius:10px;display:inline-grid;place-items:center;color:var(--ink2);transition:background .15s,color .15s}
.ib:hover{background:var(--hover);color:var(--ink)} .ib.on{color:var(--accent);background:var(--sel)}
.ib.sm{width:32px;height:32px} .ib.sm .ic{width:19px;height:19px}
.ib.round{border-radius:50%;background:var(--panel);box-shadow:var(--shadow-s);color:var(--ink)}
.ib.primary{background:var(--accent);color:#fff} .ib.fav{color:#F5A524} .ib.danger{color:var(--danger)}
.btn{height:40px;padding:0 18px;border-radius:11px;background:var(--hover);font-weight:600;display:inline-flex;align-items:center;gap:8px;justify-content:center;white-space:nowrap}
.btn:hover{background:var(--line2)} .btn.primary{background:var(--accent);color:#fff} .btn.primary:hover{filter:brightness(1.07)}
.btn.danger{background:var(--danger);color:#fff} .btn .ic{width:19px;height:19px}
.link{color:var(--accent);font-weight:500;font-size:16px;padding:6px 4px} .link.b{font-weight:700} .link.danger{color:var(--danger)}
.chip{height:32px;padding:0 12px;border-radius:9px;background:var(--hover);font-size:13.5px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;color:var(--ink)}
.chip .ic{width:17px;height:17px} .chip.on{background:var(--sel);color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.chip.danger{color:var(--danger)} .chip.sm{height:28px;padding:0 9px;font-size:12.5px}
.field{width:100%;height:40px;border-radius:10px;border:1px solid var(--line2);background:var(--panel);color:var(--ink);padding:0 12px;font:inherit;font-size:15px;outline:none}
.field:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--sel)} .field.xs{width:70px;height:32px} .field.big{height:220px;padding:10px;resize:vertical;line-height:1.45}
.sel{height:32px;border-radius:9px;border:1px solid var(--line2);background:var(--panel);color:var(--ink);font:inherit;font-size:13.5px;padding:0 8px}
.sw{width:26px;height:26px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.15);position:relative;flex:none}
.sw.on::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--accent)}
.sw.none{background:linear-gradient(135deg,transparent 45%,var(--danger) 45%,var(--danger) 55%,transparent 55%),var(--panel)}
.sw.add{display:grid;place-items:center;background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red);color:#fff;cursor:pointer}
.sw.add .ic{width:14px;height:14px;stroke-width:3;filter:drop-shadow(0 0 1px #000)} .sw.lg{width:34px;height:34px}
.cpick{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.swrow{display:flex;gap:10px;flex-wrap:wrap;padding:6px 4px;align-items:center}
.rng{accent-color:var(--accent);width:110px}
.tabs{display:flex;gap:26px;border-bottom:1px solid var(--line);margin:4px 0 18px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{padding:8px 0 10px;font-size:16px;font-weight:600;color:var(--ink3);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--ink);border-color:var(--accent)}
.search{display:flex;align-items:center;gap:8px;height:40px;border-radius:11px;border:1px solid var(--line2);background:var(--panel);padding:0 10px;color:var(--ink3)}
.search input{flex:1;border:0;outline:0;background:none;font:inherit;font-size:16px;color:var(--ink);min-width:0}
.search .ic{width:19px;height:19px} .search.sm{height:34px} .search.wide{flex:1;max-width:780px;border-radius:20px;box-shadow:var(--shadow-s);border-color:var(--line)}
kbd{font:600 12px ui-monospace,Menlo,monospace;padding:3px 7px;border-radius:6px;background:var(--hover);border:1px solid var(--line2)}
.vsep{width:1px;height:24px;background:var(--line2);margin:0 4px;flex:none}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}

/* estructura biblioteca */
#app{display:flex;height:100%}
#side{width:300px;flex:none;background:var(--side);padding:calc(10px + var(--safe-t)) 12px 10px;display:flex;flex-direction:column;gap:4px;overflow-y:auto;border-right:1px solid var(--line)}
.side-top{display:flex;justify-content:space-between;margin-bottom:6px}
#side .search{margin-bottom:8px}
.nav{display:flex;align-items:center;gap:12px;width:100%;padding:9px 10px;border-radius:11px;font-size:16.5px;text-align:left;color:var(--ink)}
.nav:hover{background:var(--hover)} .nav.on{background:var(--line);font-weight:700}
.nav .ic{width:24px;height:24px;color:var(--ink2)} .nav small{margin-left:auto;color:var(--ink3);font-size:13px}
.nav.folder{padding:10px 12px;font-size:16px} .nav.folder .fn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .nav.drop{background:var(--sel)}
.nav.sm{font-size:14px;color:var(--ink2)} .nav.sm .ic{width:20px;height:20px}
.fdot{width:16px;height:16px;border-radius:50%;flex:none;display:inline-block;vertical-align:-2px;margin-right:2px}
.fdot.lg{width:22px;height:22px;margin-right:12px;vertical-align:-1px}
.side-h{display:flex;align-items:center;justify-content:space-between;padding:18px 6px 6px 12px;color:var(--ink3);font-weight:600;font-size:14.5px}
.folders{display:flex;flex-direction:column;gap:2px;flex:1}
.side-foot{border-top:1px solid var(--line);padding-top:8px;margin-top:8px}
#main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
#top{display:flex;align-items:center;gap:6px;padding:calc(10px + var(--safe-t)) 18px 4px}
#top .new{height:38px;padding:0 16px;font-size:16px;border-radius:10px;margin-left:6px} #top .new .ic{stroke-width:2.4}
.menu-btn{display:none!important}
#content{flex:1;overflow-y:auto;padding:6px 32px 60px;-webkit-overflow-scrolling:touch}
.head{display:flex;align-items:center;gap:16px;margin:8px 0 10px;flex-wrap:wrap}
.head h1{font-size:34px;font-weight:900;letter-spacing:-.8px;margin:0;flex:1;min-width:0}
.head-tools{display:flex;align-items:center;gap:4px}
h2.sec{font-size:21px;font-weight:800;letter-spacing:-.3px;margin:30px 0 14px}
.empty{text-align:center;color:var(--ink2);padding:70px 20px}
.empty>span .ic{width:48px;height:48px;margin:0 auto 10px;stroke-width:1.3;color:var(--ink3)}
.empty h3{color:var(--ink);margin:6px 0}

/* inicio */
.hero{text-align:center;padding:50px 0 10px;max-width:960px;margin:0 auto}
.hero .logo .ic{width:76px;height:76px;margin:0 auto;stroke-width:0}
.hero h1{font-size:36px;font-weight:900;letter-spacing:-1px;margin:8px 0 4px}
.hero p{color:var(--ink2);font-size:17px;margin:0 0 28px}
.cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.hcard{border-radius:18px;padding:26px 18px;display:flex;flex-direction:column;align-items:center;gap:6px;border:1.5px solid;transition:transform .15s}
.hcard:hover{transform:translateY(-2px)} .hcard .ic{width:28px;height:28px}
.hcard b{font-size:17.5px} .hcard small{color:var(--ink2);font-size:14px;line-height:1.35}
.hcard.blue{background:#EEF2FF;border-color:#A9B9F8} .hcard.amber{background:#FFF7EA;border-color:#F5CF8E} .hcard.gray{background:#F5F5F7;border-color:#C9CCD4}
[data-theme=dark] .hcard.blue{background:#1C2340;border-color:#3C4C8C} [data-theme=dark] .hcard.amber{background:#33291A;border-color:#7C5F2B} [data-theme=dark] .hcard.gray{background:#25262A;border-color:#45474F}
.puzzle-card{display:flex;align-items:stretch;border-radius:16px;overflow:hidden;background:#EEF2FF;width:330px;max-width:100%;text-align:left}
[data-theme=dark] .puzzle-card{background:#1C2340}
.puzzle-card>div:first-child{padding:0 16px 14px;flex:1;display:flex;flex-direction:column;gap:3px}
.puzzle-card b{font-size:18px;margin-top:8px} .puzzle-card small{color:var(--ink2)}
.tag{align-self:flex-start;background:var(--accent);color:#fff;font-size:12px;font-weight:800;padding:4px 10px;border-radius:0 0 8px 0;margin-left:-16px;letter-spacing:.5px}
.tag.ok{background:var(--ok)}
.pz-ic{background:#B9C6FA;display:grid;place-items:center;width:100px} .pz-ic .ic{width:54px;height:54px;color:#1C1C1E;stroke-width:1.8}
.study-row{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px}
.study-chip{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:14px 16px;border-radius:14px;background:var(--panel);box-shadow:var(--shadow-s);border:1px solid var(--line);min-width:200px;text-align:left}
.study-chip .ic{color:var(--accent)} .study-chip small{color:var(--ink2)}

/* notas */
.ngrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:22px 18px}
.ngrid.row-scroll{display:flex;overflow-x:auto;padding:4px 2px 10px} .ngrid.row-scroll .ncard{width:170px;flex:none}
.ncard{cursor:pointer;position:relative;border-radius:14px}
.nthumb{aspect-ratio:3/3.6;border-radius:12px;overflow:hidden;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 1px var(--line);position:relative;transition:transform .15s,box-shadow .15s}
.ncard:hover .nthumb{transform:translateY(-2px);box-shadow:var(--shadow)}
.nthumb img{width:100%;height:100%;object-fit:cover;object-position:top;display:block} .nthumb .blank{width:100%;height:100%;background:#fff}
.badge{position:absolute;right:8px;bottom:8px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center}
.badge .ic{width:16px;height:16px}
.ck{position:absolute;left:8px;top:8px;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.9);border:2px solid var(--line2);display:grid;place-items:center;color:#fff}
.ncard.picked .ck{background:var(--accent);border-color:var(--accent)} .ncard.picked .nthumb{box-shadow:0 0 0 3px var(--accent)}
.ck .ic{width:16px;height:16px;stroke-width:3}
.ninfo{padding:8px 2px 0;display:grid;grid-template-columns:1fr auto;gap:0 4px}
.ninfo b{font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;grid-column:1}
.ninfo small{color:var(--ink2);font-size:13px;grid-column:1;display:flex;align-items:center;gap:5px}
.ninfo small .fdot{width:10px;height:10px}
.nact{grid-column:2;grid-row:1/3;display:flex;align-items:center}
.nlist{display:flex;flex-direction:column;gap:4px}
.nlist .ncard{display:flex;align-items:center;gap:14px;padding:8px;border-radius:12px} .nlist .ncard:hover{background:var(--hover)}
.nlist .nthumb{width:56px;flex:none} .nlist .ninfo{flex:1;padding:0}
.selbar{position:sticky;bottom:10px;margin-top:20px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--panel);box-shadow:var(--shadow);border-radius:16px;padding:10px 14px;border:1px solid var(--line)}
.selbar>span{font-weight:600;margin-right:auto}

/* galería */
.grow-row{display:flex;gap:16px;overflow-x:auto;padding:4px 2px 14px;scroll-snap-type:x proximity}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px}
.gcard{width:214px;flex:none;border-radius:14px;background:var(--panel);box-shadow:0 1px 4px rgba(0,0,0,.08),0 0 0 1px var(--line);overflow:hidden;scroll-snap-align:start;display:flex;flex-direction:column}
.ggrid .gcard{width:auto}
.gprev{position:relative;aspect-ratio:1/1;overflow:hidden;display:block;background:#fff}
.gprev canvas{width:100%;display:block}
.gtag{position:absolute;right:8px;top:8px;background:rgba(255,255,255,.92);color:#333;font-size:12px;font-weight:600;padding:3px 9px;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.ginfo{padding:10px 14px 2px;display:flex;flex-direction:column}
.ginfo b{font-size:15.5px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis} .ginfo small{color:var(--ink2)}
.gact{display:flex;align-items:center;gap:6px;padding:8px 12px 12px}
.gav{width:36px;height:36px;border-radius:50%;background:#EEF2FF;display:grid;place-items:center;margin-right:auto}
.gav .ic{width:24px;height:24px;stroke-width:0}
.heart{border-radius:50%!important;box-shadow:inset 0 0 0 1.5px var(--line2)} .heart.on{color:#E64980}
.ib.primary{border-radius:50%}
.tpl-mini{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12.5px;color:var(--ink2);padding:6px;border-radius:12px}
.tpl-mini canvas{width:100%;max-width:110px;border-radius:6px;box-shadow:0 0 0 1px var(--line2),0 2px 6px rgba(0,0,0,.08);background:#fff}
.tpl-mini.on canvas{box-shadow:0 0 0 3px var(--accent)} .tpl-mini.on{color:var(--accent);font-weight:600}
.tpl-mini.more{justify-content:center;border:1.5px dashed var(--line2);min-height:140px}
.ggrid.compact{grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;max-height:65vh;overflow:auto}
.ggrid .full{grid-column:1/-1;margin:12px 0 0}
.tpl-row{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px} .tpl-row .tpl-mini{width:104px;flex:none}

/* capas y diálogos */
.layer{position:fixed;inset:0;z-index:100;background:rgba(10,12,20,.32);display:flex;opacity:0;transition:opacity .18s}
.layer.in{opacity:1}
.layer.center{align-items:center;justify-content:center;padding:20px}
.sheet{max-height:100%;display:flex;text-align:left}
.layer.center .sheet{transform:translateY(10px) scale(.98);transition:transform .2s}
.layer.in .sheet{transform:none}
.dlg{background:var(--panel);border-radius:20px;box-shadow:var(--shadow);padding:20px 22px;width:min(460px,92vw);max-height:88vh;overflow:auto}
.dlg.wide{width:min(760px,94vw)}
.dlg h3{margin:0 0 10px;font-size:19px;text-align:center}
.dlg p{line-height:1.45}
.dlg-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin:-4px -4px 10px}
.dlg-head>:first-child{justify-self:start} .dlg-head>:last-child{justify-self:end} .dlg-head h3{margin:0}
.dlg-foot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.dlg hr{border:0;border-top:1px solid var(--line);margin:18px 0}
.dlg h4{margin:16px 0 8px}
.layer.side{justify-content:flex-end}
.layer.side .sheet{height:100%;transform:translateX(30px);transition:transform .2s}
.layer.full .sheet{width:100%;height:100%}
.pop{position:fixed;z-index:200;background:var(--panel);border-radius:14px;box-shadow:0 12px 40px rgba(10,15,35,.2),0 0 0 1px var(--line);padding:6px;min-width:230px;max-width:min(360px,94vw);max-height:80vh;overflow:auto;animation:pop .14s ease-out}
.pop.wide{min-width:300px}
@keyframes pop{from{opacity:0;transform:scale(.97)}}
.mi{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:9px;text-align:left;font-size:15.5px}
.mi:hover{background:var(--hover)} .mi.danger{color:var(--danger)}
.mi .mt{flex:1;display:flex;flex-direction:column} .mi small{color:var(--ink2);font-size:12.5px;margin-top:2px}
.mi .mic .ic{width:20px;height:20px;color:var(--ink2)} .mi.danger .mic .ic{color:var(--danger)}
.mi .chk{width:18px} .mi .chk .ic{width:18px;height:18px;color:var(--accent);stroke-width:2.5}
.pop .sep{height:1px;background:var(--line);margin:5px 8px}
.pop-row{display:grid;grid-template-columns:1fr 1fr;gap:0;margin-top:4px;border-top:1px solid var(--line)}
.pop-row button{padding:14px;display:grid;place-items:center;border-radius:9px;color:var(--ink2)} .pop-row button:hover{background:var(--hover)} .pop-row button.on{color:var(--accent)}
#toast{position:fixed;left:50%;bottom:calc(30px + var(--safe-b));transform:translate(-50%,20px);background:rgba(28,28,30,.92);color:#fff;padding:11px 18px;border-radius:12px;font-size:14.5px;opacity:0;pointer-events:none;transition:all .25s;z-index:400;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.busy{position:fixed;inset:0;z-index:300;background:rgba(10,12,20,.25);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#fff;font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.4)}
.spin{width:38px;height:38px;border-radius:50%;border:4px solid rgba(255,255,255,.35);border-top-color:#fff;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ajustes */
.settings{display:grid;grid-template-columns:230px 1fr;width:min(1000px,94vw);height:min(780px,88vh);background:var(--panel);border-radius:22px;box-shadow:var(--shadow);overflow:hidden;position:relative}
.set-nav{background:var(--side);padding:24px 12px 50px;display:flex;flex-direction:column;gap:2px;overflow:auto;border-right:1px solid var(--line)}
.set-nav button{text-align:left;padding:12px 14px;border-radius:11px;font-size:16px} .set-nav button:hover{background:var(--hover)} .set-nav button.on{background:var(--line);font-weight:600}
.set-ver{position:absolute;left:28px;bottom:16px;font-size:12.5px;color:var(--ink3)}
.set-main{display:flex;flex-direction:column;min-height:0;background:var(--side)}
[data-theme=light] .set-main{background:#F6F6F8}
.set-main .dlg-head{padding:18px 18px 0;margin:0} .back-only{visibility:hidden}
.set-pane{overflow:auto;padding:14px 18px 30px;flex:1}
.sgroup{margin-bottom:18px} .sgroup h5{margin:0 4px 6px;font-size:13px;color:var(--ink2);font-weight:600}
.scard{background:var(--panel);border-radius:12px;overflow:hidden}
.srow{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 16px;border-bottom:1px solid var(--line);min-height:54px}
.srow:last-child{border-bottom:0} .srow>div:first-child{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.srow span{font-size:16px} .srow small{color:var(--ink2);font-size:12.5px;line-height:1.35}
.srow .field{max-width:260px} .srow.col{flex-direction:column;align-items:stretch} .srow.col .field{max-width:none}
.snote{font-size:12.5px;color:var(--ink2);margin:-8px 6px 18px;line-height:1.4}
.switch{position:relative;width:50px;height:30px;flex:none}

.smart .tabs{gap:18px;margin-bottom:10px} .smart .tabs button{font-size:14.5px}
.sm-body{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding-bottom:10px}
.sm-empty{text-align:center;color:var(--ink2);padding:40px 16px} .sm-empty .ic{width:40px;height:40px;margin:0 auto;color:var(--accent);stroke-width:1.3}
.tr-rec h4{margin:4px 0 8px} .seg{margin:0;padding:6px 8px;border-radius:8px;line-height:1.45;cursor:pointer;font-size:15px}
.seg:hover{background:var(--hover)} .seg.now{background:var(--sel)} .seg time{font-size:11.5px;color:var(--accent);margin-right:8px;font-variant-numeric:tabular-nums}
.seg.live{color:var(--ink2);font-style:italic}
.md{line-height:1.55;font-size:15px} .md h3,.md h4{margin:12px 0 4px} .md ul{padding-left:20px;margin:6px 0}
.cards{display:flex;flex-direction:column;gap:8px} .card{padding:10px 12px;border-radius:10px;background:var(--hover);display:flex;flex-direction:column;gap:4px} .card span{color:var(--ink2)}
.flash{height:260px;perspective:1000px;position:relative;cursor:pointer;margin:12px 0}
.flash .face{position:absolute;inset:0;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:transform .45s;background:var(--hover);box-shadow:var(--shadow-s)}
.flash .face b{font-size:20px;line-height:1.35} .flash .face small{color:var(--accent);font-weight:700;letter-spacing:1px}
.flash .back{transform:rotateY(180deg);background:var(--sel)} .flash.flip .front{transform:rotateY(180deg)} .flash.flip .back{transform:rotateY(360deg)}
.study-cards{width:min(520px,94vw)}
.quiz-q{padding:12px;border-radius:12px;background:var(--hover);display:flex;flex-direction:column;gap:6px}
.opt{text-align:left;padding:10px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line2)} .opt.ok{background:#DDF5E5;border-color:var(--ok);color:#0B5F2C} .opt.bad{background:#FDE2E5;border-color:var(--danger);color:#8A1020}
.quiz-score{font-weight:700;text-align:center}
.chat{flex:1;display:flex;flex-direction:column;gap:8px;overflow:auto;min-height:200px}
.msg{padding:10px 13px;border-radius:14px;max-width:88%;line-height:1.45;font-size:15px}
.msg.u{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:4px} .msg.a{align-self:flex-start;background:var(--hover);border-bottom-left-radius:4px}
.chat-in{display:flex;gap:6px;align-items:center;padding-top:8px}
.study{width:min(440px,94vw);text-align:center} .study h4{text-align:center}
.pomo-ring{--p:0deg;width:200px;height:200px;border-radius:50%;margin:10px auto 14px;background:conic-gradient(var(--accent) var(--p),var(--hover) 0);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.pomo-ring.brk{background:conic-gradient(var(--ok) var(--p),var(--hover) 0)}
.pomo-ring::before{content:"";position:absolute;inset:12px;border-radius:50%;background:var(--panel)}
.pomo-time{position:relative;font-size:46px;font-weight:800;font-variant-numeric:tabular-nums} .pomo-lab{position:relative;color:var(--ink2);font-size:13px}
.puz{display:grid;gap:8px;width:min(320px,80vw);margin:14px auto}
.pt{aspect-ratio:1;border-radius:14px;background:var(--accent);color:#fff;font-size:28px;font-weight:800;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18);transition:transform .1s}
.pt:active{transform:scale(.95)} .pt.empty{background:var(--hover);box-shadow:none}

/* iPhone y ventanas estrechas */
@media (max-width:820px){
  #side{position:fixed;left:0;top:0;bottom:0;z-index:50;transform:translateX(-102%);transition:transform .25s;box-shadow:var(--shadow);width:min(320px,86vw)}
  body.drawer #side{transform:none}
  body.drawer #main::after{content:"";position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:40}
  .menu-btn{display:inline-grid!important}
  #content{padding:4px 16px 60px}
  .head h1{font-size:28px}
  .cards3{grid-template-columns:1fr}
  .hcard{flex-direction:row;text-align:left;padding:16px;gap:14px} .hcard b{display:block} .hcard>span{flex:none}
  .hcard{display:grid;grid-template-columns:auto 1fr;align-items:center} .hcard small{grid-column:2}
  .hero{padding-top:16px} .hero h1{font-size:30px}
  .ngrid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:16px 12px}
  .settings{grid-template-columns:1fr;width:100vw;height:100%;border-radius:0}
  .layer.center:has(.settings){padding:0}
  .set-nav{padding-top:calc(60px + var(--safe-t))} .settings.detail .set-nav{display:none} .settings:not(.detail) .set-main{display:none}
  .back-only{visibility:visible} .set-main .dlg-head{padding-top:calc(14px + var(--safe-t))}
  .ed-top{grid-template-columns:auto 1fr;grid-template-areas:"l r" "t t";padding:calc(8px + var(--safe-t)) 8px 4px;gap:6px}
  .ed-left{grid-area:l;flex-direction:row;align-items:center;min-width:0} .ed-title{font-size:19px}
  .ed-right{grid-area:r;padding:3px} .ed-right .ib{width:34px;height:34px}
  .tb-wrap{grid-area:t;max-width:100%}
  .tool{width:38px}
  .emptybar{bottom:calc(24px + var(--safe-b))} .emptybar button{font-size:14px;padding:8px} .emptybar .ic{width:20px;height:20px}
  #ed.show-thumbs .thumbs{position:absolute;right:0;top:0;bottom:0;z-index:8;width:min(260px,80vw);box-shadow:var(--shadow)}
  .pageind{right:8px}
  .player{left:8px;right:8px;transform:none;flex-wrap:wrap;justify-content:center}
}
@media (max-width:820px) and (orientation:portrait){ .pin-pad{grid-template-columns:repeat(3,68px)} }
@media print{ body{display:none} }
